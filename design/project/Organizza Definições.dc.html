<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FAF8F5; }
    * { box-sizing: border-box; }
    input::placeholder { color: #A8A199; }
    a { color: #8A9A7B; }
    a:hover { color: #6F7D62; }
    .om-scroll::-webkit-scrollbar { width: 6px; }
    .om-scroll::-webkit-scrollbar-thumb { background: #E8E3DC; border-radius: 4px; }
    :focus-visible { outline: 2px solid #8A9A7B; outline-offset: 2px; }
  </style>
</helmet>

<div style="font-family:'Inter',sans-serif; color:#1C1A17; background:#FAF8F5; width:1440px; min-height:900px; display:flex;">

  <aside style="width:240px; flex-shrink:0; border-right:1px solid #E8E3DC; display:flex; flex-direction:column; padding:24px 16px; gap:32px;">
    <div style="font-family:'Fraunces',serif; font-size:19px; font-weight:500;">Organizza</div>
    <nav style="display:flex; flex-direction:column; gap:4px;">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
        <div onClick="{{ item.onClick }}" style-hover="background:#8A9A7B10;" style="{{ item.style }}">
          <span style="flex-shrink:0; display:flex;" dangerously-set-inner-h-t-m-l="{{ item.icon }}"></span>
          <span style="white-space:nowrap;">{{ item.label }}</span>
        </div>
      </sc-for>
    </nav>
  </aside>

  <main style="flex:1; min-width:0; display:flex;">
    <div style="width:1000px; margin:0 auto; padding:24px 40px 80px; display:flex; gap:48px;">

      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:36px; max-width:640px; margin:0 auto;">
        <h1 style="font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0;">Definições</h1>

        <!-- PERFIL -->
        <section id="perfil" style="display:flex; flex-direction:column; gap:14px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#A8A199;">Perfil</div>
          <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; padding:20px; display:flex; flex-direction:column; gap:16px;">
            <div style="display:flex; align-items:center; gap:14px;">
              <div style="width:52px;height:52px;border-radius:50%;background:#8A9A7B1F;color:#8A9A7B;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ profileInitials }}</div>
              <div>
                <div style="font-size:15px; font-weight:500;">{{ profileName }}</div>
                <div style="font-size:12px; color:#A8A199;">{{ profileRoleLabel }}</div>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Nome</label>
                <input value="{{ profileName }}" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Email</label>
                <input value="{{ profileEmail }}" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Telefone</label>
                <input value="{{ profilePhone }}" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Idioma</label>
                <select style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; background:#FFFFFF;">
                  <option>Português</option>
                  <option>English</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <!-- NOTIFICACOES -->
        <section id="notificacoes" style="display:flex; flex-direction:column; gap:14px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#A8A199;">Notificações</div>
          <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px;">
            <sc-for list="{{ notifPrefs }}" as="n" hint-placeholder-count="4">
              <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #F1EEE8;">
                <div>
                  <div style="font-size:13px; font-weight:500;">{{ n.label }}</div>
                  <div style="font-size:12px; color:#A8A199;">{{ n.desc }}</div>
                </div>
                <div onClick="{{ n.onToggle }}" style="{{ n.trackStyle }}">
                  <div style="{{ n.knobStyle }}"></div>
                </div>
              </div>
            </sc-for>
          </div>
        </section>

        <!-- SEGURANCA -->
        <section id="seguranca" style="display:flex; flex-direction:column; gap:14px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#A8A199;">Segurança</div>
          <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; padding:20px; display:flex; flex-direction:column; gap:14px;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Palavra-passe atual</label>
                <input type="password" placeholder="••••••••" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Nova palavra-passe</label>
                <input type="password" placeholder="••••••••" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
            </div>
            <button style="align-self:flex-start; background:#FFFFFF; border:1px solid #E8E3DC; border-radius:4px; padding:9px 16px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer; color:#1C1A17;">Atualizar palavra-passe</button>
          </div>
        </section>

        <!-- EMPRESA (admin only) -->
        <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ true }}">
          <section id="empresa" style="display:flex; flex-direction:column; gap:14px;">
            <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#A8A199;">Empresa</div>
            <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:14px;">
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Nome da empresa</label>
                <input value="Organizza — Eventos & Produção" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">NIF</label>
                <input value="509 887 213" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
              <div style="grid-column:1 / -1; display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; font-weight:500; color:#6B655D;">Morada</label>
                <input value="Rua das Flores 22, 1200-192 Lisboa" style="border:1px solid #E8E3DC; border-radius:4px; padding:9px 11px; font-size:13px; font-family:inherit; outline:none;"></input>
              </div>
            </div>
          </section>

          <!-- UTILIZADORES (admin only) -->
          <section id="utilizadores" style="display:flex; flex-direction:column; gap:14px;">
            <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#A8A199;">Utilizadores & funções</div>
            <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; overflow:hidden;">
              <sc-for list="{{ userRows }}" as="u" hint-placeholder-count="4">
                <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid #F1EEE8;">
                  <div style="display:flex; align-items:center; gap:12px;">
                    <div style="{{ u.avatarStyle }}">{{ u.initials }}</div>
                    <div>
                      <div style="font-size:13px; font-weight:500;">{{ u.name }}</div>
                      <div style="font-size:12px; color:#A8A199;">{{ u.email }}</div>
                    </div>
                  </div>
                  <span style="{{ u.roleStyle }}">{{ u.roleLabel }}</span>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const NAV_ICONS = {
  dashboard: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>',
  schedule: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>',
  events: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="1"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>',
  team: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.4"></circle><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><path d="M14.5 15c2.6.3 4.5 2.2 4.5 5"></path></svg>',
  documents: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"></path><polyline points="14 3 14 9 20 9"></polyline></svg>',
  settings: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>'
};
const PEOPLE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>';

const USERS = [
  { initials: 'AC', name: 'Ana Costa', email: 'ana.costa@organizza.pt', role: 'Admin' },
  { initials: 'MF', name: 'Miguel Ferreira', email: 'miguel.ferreira@organizza.pt', role: 'Employee' },
  { initials: 'RP', name: 'Rita Pereira', email: 'rita.pereira@organizza.pt', role: 'Employee' },
  { initials: 'TA', name: 'Tiago Alves', email: 'tiago.alves@organizza.pt', role: 'Employee' }
];

class Component extends DCLogic {
  state = { notifEmail: true, notifSms: false, notifSchedule: true, notifDocs: true, activeSection: 'perfil' };

  renderVals() {
    const role = localStorage.getItem('organizza_role') || 'Admin';
    const isAdmin = role === 'Admin';
    const profileName = isAdmin ? 'Ana Costa' : 'Miguel Ferreira';
    const profileEmail = isAdmin ? 'ana.costa@organizza.pt' : 'miguel.ferreira@organizza.pt';
    const profileInitials = isAdmin ? 'AC' : 'MF';
    const profilePhone = isAdmin ? '+351 917 220 331' : '+351 918 442 210';
    const profileRoleLabel = isAdmin ? 'Administrador' : 'Colaborador';

    const navDefs = [
      { key: 'dashboard', label: 'Dashboard', href: './Organizza Events Dashboard.dc.html' },
      { key: 'schedule', label: 'Calendário', href: './Organizza Schedule.dc.html' },
      { key: 'events', label: 'Eventos', href: './Organizza Events Dashboard.dc.html' },
      { key: 'team', label: 'Equipa', href: './Organizza Team.dc.html' },
      { key: 'documents', label: 'Documentos', href: './Organizza Documentos.dc.html' }
    ];
    if (isAdmin) navDefs.push({ key: 'people', label: 'Pessoas', href: './Organizza People.dc.html' });
    const navItems = navDefs.map(n => ({
      label: n.label, icon: NAV_ICONS[n.key] || PEOPLE_ICON,
      onClick: n.href ? () => { window.location.href = n.href; } : undefined,
      style: `display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:${n.active ? 500 : 400};color:${n.active ? '#1C1A17' : '#6B655D'};background:${n.active ? '#8A9A7B14' : 'transparent'};transition:background 180ms ease-out;`
    }));

    const sections = [
      { id: 'perfil', label: 'Perfil' },
      { id: 'notificacoes', label: 'Notificações' },
      { id: 'seguranca', label: 'Segurança' }
    ];
    if (isAdmin) sections.push({ id: 'empresa', label: 'Empresa' }, { id: 'utilizadores', label: 'Utilizadores' });
    const sectionNav = sections.map(s => ({ label: s.label, href: '#' + s.id,
      style: `font-size:13px; padding:8px 10px; border-radius:4px; text-decoration:none; color:#6B655D;` }));

    const track = on => `width:36px; height:20px; border-radius:10px; padding:2px; cursor:pointer; background:${on ? '#8A9A7B' : '#E8E3DC'}; transition:background 150ms ease-out;`;
    const knob = on => `width:16px; height:16px; border-radius:50%; background:#FFFFFF; transition:transform 150ms ease-out; transform:translateX(${on ? '16px' : '0'});`;
    const notifPrefs = [
      { key: 'notifEmail', label: 'Notificações por email', desc: 'Novos eventos, alterações de horário e tarefas atribuídas.' },
      { key: 'notifSms', label: 'Notificações por SMS', desc: 'Alertas urgentes apenas.' },
      { key: 'notifSchedule', label: 'Alterações de escala', desc: 'Avisar quando o meu horário for alterado.' },
      { key: 'notifDocs', label: 'Documentos a expirar', desc: 'Lembrete 30 dias antes da validade expirar.' }
    ].map(n => ({ label: n.label, desc: n.desc, trackStyle: track(this.state[n.key]), knobStyle: knob(this.state[n.key]),
      onToggle: () => this.setState({ [n.key]: !this.state[n.key] }) }));

    const userRows = USERS.map(u => ({
      initials: u.initials, name: u.name, email: u.email,
      avatarStyle: `width:34px;height:34px;border-radius:50%;background:#8A9A7B1F;color:#8A9A7B;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;`,
      roleLabel: u.role === 'Admin' ? 'Administrador' : 'Colaborador',
      roleStyle: `font-size:11px; font-weight:500; padding:4px 10px; border-radius:12px; background:${u.role === 'Admin' ? '#8A9A7B1A' : '#A8A1991A'}; color:${u.role === 'Admin' ? '#5F6E52' : '#6B655D'};`
    }));

    return { navItems, isAdmin, profileName, profileEmail, profileInitials, profilePhone, profileRoleLabel, sectionNav, notifPrefs, userRows };
  }
}
</script>
</body>
</html>
