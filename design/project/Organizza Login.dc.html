<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FAF8F5; }
    * { box-sizing: border-box; }
    input::placeholder { color: #A8A199; }
    a { color: #8A9A7B; }
    a:hover { color: #6F7D62; }
    :focus-visible { outline: 2px solid #8A9A7B; outline-offset: 2px; }
  </style>
</helmet>

<div style="font-family:'Inter',sans-serif; color:#1C1A17; background:#FAF8F5; width:1440px; min-height:900px; display:flex; align-items:center; justify-content:center;">
  <div style="width:400px; display:flex; flex-direction:column; gap:28px;">
    <div style="text-align:center; display:flex; flex-direction:column; gap:6px;">
      <div style="font-family:'Fraunces',serif; font-size:26px; font-weight:500;">Organizza</div>
      <div style="font-size:13px; color:#6B655D;">Inicie sessão para continuar</div>
    </div>

    <div style="background:#FFFFFF; border:1px solid #E8E3DC; border-radius:8px; padding:28px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; font-weight:500; color:#6B655D;">Email</label>
        <input value="{{ email }}" onChange="{{ onEmailChange }}" placeholder="nome@organizza.pt" style="border:1px solid #E8E3DC; border-radius:4px; padding:10px 12px; font-size:13px; font-family:inherit; outline:none; color:#1C1A17;"></input>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; font-weight:500; color:#6B655D;">Palavra-passe</label>
        <input type="password" value="{{ password }}" onChange="{{ onPasswordChange }}" placeholder="••••••••" style="border:1px solid #E8E3DC; border-radius:4px; padding:10px 12px; font-size:13px; font-family:inherit; outline:none; color:#1C1A17;"></input>
      </div>
      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px; color:#C4703F;">{{ error }}</div>
      </sc-if>
      <button onClick="{{ onSubmit }}" style="margin-top:6px; background:#8A9A7B; color:#FFFFFF; border:none; border-radius:4px; padding:11px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer;">Entrar</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px; color:#A8A199; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;">
        <div style="flex:1; height:1px; background:#E8E3DC;"></div>
        Acesso de demonstração
        <div style="flex:1; height:1px; background:#E8E3DC;"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button onClick="{{ loginAsAdmin }}" style="flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px; background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; padding:12px 14px; cursor:pointer; text-align:left; font-family:inherit;">
          <span style="font-size:13px; font-weight:500;">Administrador</span>
          <span style="font-size:11px; color:#A8A199;">ana.costa@organizza.pt</span>
        </button>
        <button onClick="{{ loginAsEmployee }}" style="flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px; background:#FFFFFF; border:1px solid #E8E3DC; border-radius:6px; padding:12px 14px; cursor:pointer; text-align:left; font-family:inherit;">
          <span style="font-size:13px; font-weight:500;">Colaborador</span>
          <span style="font-size:11px; color:#A8A199;">miguel.ferreira@organizza.pt</span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '', error: '' };

  go() { window.location.href = './Organizza Events Dashboard.dc.html'; }

  renderVals() {
    return {
      email: this.state.email, onEmailChange: e => this.setState({ email: e.target.value }),
      password: this.state.password, onPasswordChange: e => this.setState({ password: e.target.value }),
      error: this.state.error,
      onSubmit: () => this.setState({ error: 'Utilize um dos acessos de demonstração abaixo.' }),
      loginAsAdmin: () => { localStorage.setItem('organizza_role', 'Admin'); this.go(); },
      loginAsEmployee: () => { localStorage.setItem('organizza_role', 'Employee'); this.go(); }
    };
  }
}
</script>
</body>
</html>
